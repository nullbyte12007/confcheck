!
! Fixture: konfigurasi Cisco IOS yang SUDAH baik
!
hostname ROUTER-BAIK
!
service password-encryption
!
aaa new-model
!
enable secret 5 $1$abcd$S3cretHashYangPanjang
!
banner motd ^CAKSES TERBATAS. Hanya untuk petugas berwenang.^C
!
no ip http server
ip http secure-server
!
snmp-server group ADMIN v3 priv
snmp-server user monitoring ADMIN v3 auth sha Rahasia123 priv aes 128 Rahasia456
snmp-server community Str4wB3rryR4nd0m RO 10
access-list 10 permit 10.10.0.0 0.0.255.255
!
logging host 10.10.0.5
logging trap informational
!
ntp server 10.10.0.6
ntp server 10.10.0.7
!
no cdp run
!
interface GigabitEthernet0/0
 description UPLINK-ISP
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-UTAMA
 ip address 10.10.0.1 255.255.0.0
 no shutdown
!
interface GigabitEthernet0/2
 description CADANGAN
 shutdown
!
line vty 0 15
 transport input ssh
 exec-timeout 5 0
 login local
!
end
